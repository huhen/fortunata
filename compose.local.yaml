services:
  fortunata:
    build: .
    image: fortunata:local
    ports:
      - "8080:8080"
    environment:
      ADMIN_PASSWORD: test123
      SESSION_SECRET: local-test-secret
      COOKIE_SECURE: "false"
      DB_PATH: /data/fortunata.db
      ADDR: ":8080"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - fortunata-local-data:/data

volumes:
  fortunata-local-data:
