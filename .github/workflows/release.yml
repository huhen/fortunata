name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Версия (CalVer + время + хеш)
        run: echo "VERSION=v$(git show -s --format='%cd' --date=format:'%Y.%m.%d-%H%M' HEAD)-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go test
        run: go test ./...

      - name: Сборка бинарника linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X fortunata/internal/version.Version=${VERSION}" \
            -o dist/fortunata-linux-amd64 ./cmd/server

      - name: Описание релиза (заголовок и тело PR)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '# %s\n' "$PR_TITLE" > dist/release-notes.md
          if [ -n "$(printf '%s' "$PR_BODY" | tr -d '[:space:]')" ]; then
            printf '\n%s\n' "$PR_BODY" >> dist/release-notes.md
          fi

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: dist/release-notes.md
          files: dist/fortunata-linux-amd64
          fail_on_unmatched_files: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Публикация образа в GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            VERSION=${{ env.VERSION }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
